<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fawdaoui Game 🎮</title>

<style>
* {
    box-sizing: border-box;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 0;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow: hidden;
}

h1 {
    margin: 12px 0 5px;
    font-size: 32px;
}

#hud {
    font-size: 22px;
    margin-bottom: 12px;
}

#game {
    width: min(92vw, 650px);
    height: min(70vh, 900px);
    min-height: 500px;
    border: 6px solid white;
    border-radius: 25px;
    background: #1f2937;
    display: block;
    margin: auto;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 18px;
    direction: ltr;
}

.control {
    width: 95px;
    height: 85px;
    border: 0;
    border-radius: 22px;
    background: #374151;
    color: white;
    font-size: 38px;
    cursor: pointer;
    box-shadow: 0 5px 0 #1f2937;
}

.control:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 #1f2937;
}

#restart {
    margin-top: 22px;
    padding: 18px 45px;
    border: 0;
    border-radius: 20px;
    background: #16a34a;
    color: white;
    font-size: 23px;
    font-weight: bold;
    cursor: pointer;
}

#restart:active {
    transform: scale(.97);
}

#message {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.78);
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 10;
}

#message h2 {
    font-size: 42px;
    margin: 10px;
}

#message p {
    font-size: 24px;
}

@media (max-width: 500px) {
    h1 {
        font-size: 29px;
    }

    #hud {
        font-size: 20px;
    }

    #game {
        width: 94vw;
        height: 65vh;
        min-height: 450px;
    }

    .control {
        width: 78px;
        height: 75px;
        font-size: 32px;
    }
}
</style>
</head>

<body>

<h1>Fawdaoui Game 🎮</h1>

<div id="hud">
    النقاط: <span id="score">0</span>
    &nbsp; | &nbsp;
    الحياة: <span id="lives">2</span>
</div>

<canvas id="game" width="400" height="550"></canvas>

<div class="controls">
    <button class="control" id="right">➡️</button>
    <button class="control" id="down">⬇️</button>
    <button class="control" id="up">⬆️</button>
    <button class="control" id="left">⬅️</button>
</div>

<button id="restart">إعادة اللعب 🔄</button>

<div id="message">
    <h2>انتهت اللعبة 💀</h2>
    <p>النقاط: <span id="finalScore">0</span></p>
    <button id="restart2">إعادة اللعب 🔄</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const livesElement = document.getElementById("lives");
const message = document.getElementById("message");
const finalScore = document.getElementById("finalScore");

const player = {
    x: 180,
    y: 470,
    width: 38,
    height: 38,
    speed: 6
};

let score = 0;
let lives = 2;
let gameRunning = true;

let keys = {
    left: false,
    right: false,
    up: false,
    down: false
};

let enemies = [];
let coins = [];

function randomX(size) {
    return Math.random() * (canvas.width - size);
}

function randomY() {
    return -50 - Math.random() * 300;
}

function createEnemy() {
    enemies.push({
        x: randomX(34),
        y: randomY(),
        width: 34,
        height: 34,
        speed: 2 + Math.random() * 2.5
    });
}

function createCoin() {
    coins.push({
        x: randomX(34),
        y: randomY(),
        radius: 17,
        speed: 2 + Math.random() * 2
    });
}

for (let i = 0; i < 4; i++) {
    createEnemy();
}

for (let i = 0; i < 4; i++) {
    createCoin();
}

function drawBackground() {
    ctx.fillStyle = "#1f2937";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "rgba(255,255,255,.06)";
    ctx.lineWidth = 2;

    for (let x = 0; x <= canvas.width; x += 32) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }

    for (let y = 0; y <= canvas.height; y += 32) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }
}

function drawPlayer() {
    ctx.fillStyle = "#22c55e";
    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );

    ctx.fillStyle = "white";

    ctx.fillRect(
        player.x + 9,
        player.y + 9,
        7,
        7
    );

    ctx.fillRect(
        player.x + 23,
        player.y + 9,
        7,
        7
    );
}

function drawEnemy(enemy) {
    ctx.fillStyle = "#ef4444";

    ctx.beginPath();
    ctx.arc(
        enemy.x + enemy.width / 2,
        enemy.y + enemy.height / 2,
        enemy.width / 2,
        0,
        Math.PI * 2
    );
    ctx.fill();
}

function drawCoin(coin) {
    ctx.fillStyle = "#facc15";

    ctx.beginPath();
    ctx.arc(
        coin.x + coin.radius,
        coin.y + coin.radius,
        coin.radius,
        0,
        Math.PI * 2
    );
    ctx.fill();

    ctx.fillStyle = "#92400e";
    ctx.font = "bold 20px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        "★",
        coin.x + coin.radius,
        coin.y + coin.radius
    );
}

function collision(a, b) {
    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

function coinCollision(player, coin) {
    const closestX = Math.max(
        player.x,
        Math.min(coin.x + coin.radius, player.x + player.width)
    );

    const closestY = Math.max(
        player.y,
        Math.min(coin.y + coin.radius, player.y + player.height)
    );

    const dx = coin.x + coin.radius - closestX;
    const dy = coin.y + coin.radius - closestY;

    return dx * dx + dy * dy <
        coin.radius * coin.radius;
}

function updatePlayer() {
    if (keys.left) {
        player.x -= player.speed;
    }

    if (keys.right) {
        player.x += player.speed;
    }

    if (keys.up) {
        player.y -= player.speed;
    }

    if (keys.down) {
        player.y += player.speed;
    }

    if (player.x < 0) {
        player.x = 0;
    }

    if (player.y < 0) {
        player.y = 0;
    }

    if (player.x + player.width > canvas.width) {
        player.x = canvas.width - player.width;
    }

    if (player.y + player.height > canvas.height) {
        player.y = canvas.height - player.height;
    }
}

function updateEnemies() {
    for (let i = enemies.length - 1; i >= 0; i--) {

        const enemy = enemies[i];

        enemy.y += enemy.speed;

        if (collision(player, enemy)) {

            enemies.splice(i, 1);

            lives--;

            livesElement.textContent = lives;

            createEnemy();

            if (lives <= 0) {
                endGame();
                return;
            }

            continue;
        }

        if (enemy.y > canvas.height + 50) {
            enemies.splice(i, 1);
            createEnemy();
        }
    }
}

function updateCoins() {
    for (let i = coins.length - 1; i >= 0; i--) {

        const coin = coins[i];

        coin.y += coin.speed;

        if (coinCollision(player, coin)) {

            coins.splice(i, 1);

            score += 10;

            scoreElement.textContent = score;

            createCoin();

            continue;
        }

        if (coin.y > canvas.height + 50) {
            coins.splice(i, 1);
            createCoin();
        }
    }
}

function draw() {

    drawBackground();

    for (const coin of coins) {
        drawCoin(coin);
    }

    for (const enemy of enemies) {
        drawEnemy(enemy);
    }

    drawPlayer();
}

function gameLoop() {

    if (!gameRunning) {
        return;
    }

    updatePlayer();
    updateEnemies();
    updateCoins();
    draw();

    requestAnimationFrame(gameLoop);
}

function endGame() {

    gameRunning = false;

    finalScore.textContent = score;

    message.style.display = "flex";
}

function restartGame() {

    score = 0;
    lives = 2;

    scoreElement.textContent = score;
    livesElement.textContent = lives;

    player.x = 180;
    player.y = 470;

    enemies = [];
    coins = [];

    for (let i = 0; i < 4; i++) {
        createEnemy();
    }

    for (let i = 0; i < 4; i++) {
        createCoin();
    }

    message.style.display = "none";

    gameRunning = true;

    gameLoop();
}

document.getElementById("restart")
    .addEventListener("click", restartGame);

document.getElementById("restart2")
    .addEventListener("click", restartGame);

function controlButton(id, direction) {

    const button = document.getElementById(id);

    button.addEventListener("pointerdown", function(e) {
        e.preventDefault();
        keys[direction] = true;
    });

    button.addEventListener("pointerup", function(e) {
        e.preventDefault();
        keys[direction] = false;
    });

    button.addEventListener("pointerleave", function() {
        keys[direction] = false;
    });

    button.addEventListener("pointercancel", function() {
        keys[direction] = false;
    });
}

controlButton("left", "left");
controlButton("right", "right");
controlButton("up", "up");
controlButton("down", "down");

document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowLeft") {
        keys.left = true;
    }

    if (e.key === "ArrowRight") {
        keys.right = true;
    }

    if (e.key === "ArrowUp") {
        keys.up = true;
    }

    if (e.key === "ArrowDown") {
        keys.down = true;
    }
});
